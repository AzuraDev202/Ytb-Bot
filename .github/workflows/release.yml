name: Build desktop release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Test updater
        run: python -m unittest discover -s tests -v
      - name: Build and verify version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/build_release.py $env:RELEASE_TAG
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create $env:RELEASE_TAG dist/gui_app.exe dist/gui_app.exe.sha256 --verify-tag --generate-notes --title "Ytb-Bot $env:RELEASE_TAG"
