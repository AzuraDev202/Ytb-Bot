name: Build desktop release
"on":
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release/prepare_release.py
      - name: Install build dependencies
        if: steps.version.outputs.publish == 'true'
        run: python -m pip install -r requirements-dev.txt
      - name: Test updater
        if: steps.version.outputs.publish == 'true'
        run: python -m unittest discover -s tests -v
      - name: Build and verify version
        if: steps.version.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: python scripts/release/build_release.py $env:RELEASE_TAG
      - name: Test React interactions
        if: steps.version.outputs.publish == 'true'
        working-directory: frontend
        run: npm test
      - name: Verify React and Python bridge
        if: steps.version.outputs.publish == 'true'
        run: python scripts/checks/smoke_react.py
      - name: Verify desktop window appears
        if: steps.version.outputs.publish == 'true'
        run: ./scripts/checks/smoke_desktop.ps1
      - name: Publish new release
        if: steps.version.outputs.publish == 'true' && steps.version.outputs.refresh != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: gh release create $env:RELEASE_TAG dist/gui_app.exe dist/gui_app.exe.sha256 dist/build-info.json --target $env:RELEASE_COMMIT --generate-notes --latest --title "Ytb-Bot $env:RELEASE_TAG"
      - name: Refresh existing release assets
        if: steps.version.outputs.refresh == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh release upload $env:RELEASE_TAG dist/gui_app.exe dist/gui_app.exe.sha256 dist/build-info.json --clobber
